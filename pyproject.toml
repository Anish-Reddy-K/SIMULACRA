[project]
name = "simulacra"
version = "0.1.0"
description = "Local-first platform for simulating experiments with synthetic AI personas"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "platformdirs>=4.2",
  "httpx>=0.28.1",
  "psutil>=7.2.2",
  "numpy>=2.5.4",
]

[project.scripts]
simulacra = "simulacra.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulacra"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/simulacra/benchmarks/recommend.py" = ["E501"]  # user-facing explanation strings

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
markers = ["real: needs real local runtimes"]
testpaths = ["tests"]
addopts = "-ra"
